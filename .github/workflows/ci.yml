name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (legacy + Spark parity)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache Delta Lake jars (Ivy)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  bundle-validate:
    name: databricks bundle validate
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: env.DATABRICKS_HOST == ''
        run: echo "::notice::DATABRICKS_HOST secret is not set; skipping databricks bundle validate."

      - uses: databricks/setup-cli@v1.23.0
        if: env.DATABRICKS_HOST != ''

      - name: Validate dev and prod targets
        if: env.DATABRICKS_HOST != ''
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t prod
